<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0f12">
<title>MESORA · Mando</title>
<style>
  :root { --bg: #0e0f12; --panel: #1c1f26; --line: #2a2f3a; --text: #e8eaef; --muted: #8d94a3; --accent: #ff4d3d; --live: #22c55e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header b { font-size: 13px; letter-spacing: .12em; flex: none; }
  header div { min-width: 0; text-align: right; }
  #status { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #take { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.live { color: var(--live); }
  .preview { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #shoot { height: 96px; border: 0; border-radius: 16px; background: var(--accent); color: #fff; font-size: 24px; font-weight: 800; letter-spacing: .04em; }
  #shoot:active { filter: brightness(.85); transform: scale(.99); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button { height: 58px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); font-size: 15px; font-weight: 600; }
  .grid button:active { background: #2b303b; }
  .grid .wide { grid-column: span 3; }
  #msg { min-height: 18px; color: var(--muted); font-size: 13px; text-align: center; }
  #msg.err { color: #ff8a80; }
</style>
</head>
<body>
  <header><b>MESORA</b><div><div id="status">Conectando…</div><div id="take"></div></div></header>
  <div class="preview" id="preview"><span id="noPreview">Sin vista previa</span><img id="img" alt="Visor de MESORA" hidden></div>
  <button id="shoot" data-action="capture">CAPTURAR</button>
  <div class="grid">
    <button data-action="prev">‹ Anterior</button>
    <button data-action="play">Reproducir</button>
    <button data-action="next">Siguiente ›</button>
    <button data-action="live">En vivo</button>
    <button data-action="shortPlay">Repaso corto</button>
    <button data-action="onion">Cebolla</button>
    <button data-action="undo" class="wide">Deshacer</button>
  </div>
  <div id="msg"></div>
<script>
  // The access code comes in the address of the QR and is sent with every request.
  const token = new URLSearchParams(location.search).get('t') || '';
  const headers = { 'X-Mesora-Token': token };
  const $ = (id) => document.getElementById(id);
  let busy = false;

  function say(text, error = false) {
    $('msg').textContent = text;
    $('msg').className = error ? 'err' : '';
  }

  async function act(action) {
    try {
      const r = await fetch('/api/action', { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ action }) });
      if (!r.ok) throw new Error((await r.json()).error || r.statusText);
      if (navigator.vibrate) navigator.vibrate(action === 'capture' ? 40 : 15);
      say('');
      setTimeout(poll, 250);
    } catch (err) {
      say(`No se pudo: ${err.message}`, true);
    }
  }

  for (const b of document.querySelectorAll('[data-action]')) b.addEventListener('click', () => act(b.dataset.action));

  let lastUrl = null;
  async function poll() {
    if (busy) return;
    busy = true;
    try {
      const st = await (await fetch('/api/state', { headers })).json();
      if (st.error) throw new Error(st.error);
      $('status').textContent = st.playing ? 'Reproduciendo' : st.live ? `EN VIVO · siguiente ${st.frames + 1}` : `Fotograma ${st.position} / ${st.frames}`;
      $('take').textContent = [st.project, st.take].filter(Boolean).join(' · ');
      $('status').className = st.live && !st.playing ? 'live' : '';
      const r = await fetch('/api/preview.jpg', { headers });
      if (r.status === 200) {
        const url = URL.createObjectURL(await r.blob());
        $('img').src = url;
        $('img').hidden = false;
        $('noPreview').hidden = true;
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = url;
      }
      if ($('msg').className === 'err' && /conexión/.test($('msg').textContent)) say('');
    } catch (err) {
      say(`Sin conexión con MESORA: ${err.message}`, true);
    } finally {
      busy = false;
    }
  }
  poll();
  setInterval(poll, 700);
</script>
</body>
</html>
